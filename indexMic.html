<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Mic Level</title>
  <style>
    body { background:#111; color:#0ff; font-family:monospace; text-align:center; }
    #bar { width:40px; height:0; background:#0ff; margin:40px auto; transition:height 0.05s; }
  </style>
</head>
<body>
  <h2>ESP32 WebSocket Mic Level</h2>
  <p id="status">Connecting...</p>
  <div id="bar"></div>

  <!-- <script>

  ws.onmessage = e => {

  <script>
    const ESP32_IP = "10.231.242.101";
    const status = document.getElementById("status");
    const bar = document.getElementById("bar");

    let ws;

    function connect() {
      ws = new WebSocket(`ws://${ESP32_IP}:5500/ws`);
      ws.binaryType = "arraybuffer";

      ws.onopen = () => {
        status.innerText = "Connected";
        console.log("WS open");
      };

      ws.onclose = (e) => {
        status.innerText = `Disconnected (code ${e.code})`;
        console.log("WS close:", e.code, e.reason);
        // auto reconnect
        setTimeout(connect, 1000);
      };

      ws.onerror = (e) => {
        console.log("WS error:", e);
      };

      ws.onmessage = (event) => {
        const level = new Int16Array(event.data)[0];
        bar.style.height = Math.min(level / 5, 300) + "px";
      };
    }

    connect();
  </script>
</body>
</html>
