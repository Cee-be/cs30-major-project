<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ESP32 I2S WebSocket Audio Player</title>
  <script src="https://unpkg.com/pcm-player"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    #status { font-size: 20px; margin-bottom: 10px; }
  </style>
</head>

<body>
  <h2>ESP32 → WebSocket → Browser Audio</h2>

  <p id="status">Connecting to ESP32...</p>

  <script>
    // 🔵 CHANGE THIS TO YOUR ESP32's IP ADDRESS
    const ESP32_IP = "192.168.35.101";

    const ws = new WebSocket(`ws://${ESP32_IP}:81/ws`);
    ws.binaryType = "arraybuffer";

    // 🔊 PCM Player settings — must match ESP32 I2S config
    const player = new PCMPlayer({
      encoding: '32bitInt',   // ESP32 uses 32-bit samples
      channels: 1,            // INMP441 is mono
      sampleRate: 16000,      // you set 16000 in I2S
      flushingTime: 30
    });

    ws.onopen = () => {
      document.getElementById("status").innerText = "Connected!";
      console.log("WebSocket connected.");
    };

    ws.onclose = () => {
      document.getElementById("status").innerText = "Disconnected!";
      console.log("WebSocket disconnected.");
    };

    ws.onmessage = (event) => {
      const pcm32 = new Int32Array(event.data);
      player.feed(pcm32);
    };
  </script>

</body>
</html>
